name: Cloudflare compatibility

on:
  push:
    branches: [test/cloudflare-workers]
  workflow_dispatch:

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Install dependencies
        run: npm install
      - name: Check Next.js compatibility with vinext
        run: npx --yes vinext@latest check
      - name: Validate current Next.js build
        run: npm run build
        env:
          AIRTABLE_TOKEN: pat_ci_placeholder
          AIRTABLE_BASE_ID: appfHlDc9F79EB56n
