name: Cloudflare Workers compatibility

on:
  push:
    branches: [test/cloudflare-workers]
  workflow_dispatch:

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Install dependencies
        run: npm install

      - name: Check Next.js compatibility with vinext
        run: npx vinext check

      - name: Build minimal Cloudflare Workers target
        run: npm run build:vinext
        env:
          AIRTABLE_TOKEN: pat_ci_placeholder
          AIRTABLE_BASE_ID: appfHlDc9F79EB56n

      - name: Verify Workers output
        run: |
          test -f dist/server/wrangler.json
          test -d dist/client
          echo "Minimal Cloudflare Workers build output is valid"

      - name: Verify original Next.js build still works
        run: npm run build
        env:
          AIRTABLE_TOKEN: pat_ci_placeholder
          AIRTABLE_BASE_ID: appfHlDc9F79EB56n
