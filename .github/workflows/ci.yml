name: CI

on:
  push:
    branches: [main, test/cloudflare-workers]
  pull_request:
    branches: [main]

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Install dependencies
        run: npm install
      - name: Check Cloudflare vinext compatibility
        run: npx --yes vinext@latest check
      - name: Build Cloudflare target
        run: npm run build:vinext
        env:
          AIRTABLE_TOKEN: pat_ci_placeholder
          AIRTABLE_BASE_ID: appfHlDc9F79EB56n
